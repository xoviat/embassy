[package]
name = "embassy-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Driver trait for `embassy-crypto`."
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-crypto"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-crypto-driver-v$VERSION/embassy-net-driver/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-crypto-driver/src/"
features = ["defmt", "driver-sha2", "driver-aes128", "driver-p256-scalar-mul"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt", "driver-sha2", "driver-aes128", "driver-p256-scalar-mul"]

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = ["defmt", "driver-sha2", "driver-aes128", "driver-p256-scalar-mul"]},
]

[dependencies]
signature = { version = "3", default-features = false, features = ["digest", "rand_core"] }
embassy-crypto-driver = { path = "../embassy-crypto-driver" }
digest = { version = "0.11", default-features = false, features = ["mac", "zeroize"] }
crypto-common = "0.2"
cipher = { version = "0.5", default-features = false }
aead = { version = "0.6", default-features = false }
generic-array = "1.4.5"
heapless = "0.9"

# RustCrypto software dependencies, used directly when the corresponding
# `driver-*` feature is enabled (all optional).
md-5 = { version = "0.11", default-features = false, optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
aes = { version = "0.9", default-features = false, optional = true }
aes-gcm = { version = "0.11", default-features = false, features = ["aes"], optional = true }
ccm = { version = "0.6", default-features = false, optional = true }
ctr = { version = "0.10", default-features = false, optional = true }
cbc = { version = "0.2", default-features = false, optional = true }
cmac = { version = "0.8", default-features = false, optional = true }

# P-256: software arithmetic wrapped by the `p256` module (scalar
# multiplication is delegated to the `P256ScalarMul` driver), and the
# software fallback for the `P256Ec` high-level unitrait.
elliptic-curve = { version = "0.14", default-features = false, features = ["arithmetic", "sec1"], optional = true }
ecdsa = { version = "0.17", default-features = false, features = ["digest", "algorithm"], optional = true }

p256 = { version = "0.14", default-features = false, features = ["arithmetic"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["arithmetic"], optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"], optional = true }
defmt = "1.1.1"

[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8"] }
rand = { version = "0.10", default-features = false, features = ["thread_rng", "std_rng", "sys_rng"] }

[features]
defmt = ["embassy-crypto-driver/defmt"]

## Generic RustCrypto `elliptic-curve` trait implementations over a driver-accelerated
## curve backend (the `ec` module).
ec = ["dep:elliptic-curve"]
## ECDSA support for the `ec` module.
ecdsa = ["ec", "dep:ecdsa"]
## The `ec` module instantiated for P-256 (the `p256` module), with scalar
## multiplication delegated to the `P256ScalarMul` driver.
p256 = ["ec", "dep:p256"]
## ECDSA signing/verification types for the `p256` module.
p256-ecdsa = ["p256", "ecdsa", "p256/ecdsa"]
## The `ec` module instantiated for P-384 (the `p384` module). Pure software
## for now: there are no P-384 driver traits yet.
p384 = ["ec", "dep:p384"]
## ECDSA signing/verification types for the `p384` module.
p384-ecdsa = ["p384", "ecdsa", "p384/ecdsa"]
## PKCS#8/SPKI support: `AssociatedOid` impls for the accelerated curve
## types, unlocking DER encoding of keys. Applies to whichever of `p256`/
## `p384` is enabled.
pkcs8 = ["ec", "elliptic-curve/pkcs8", "p256?/pkcs8", "p384?/pkcs8"]

## The `driver-*` features below select whether each operation is performed
## by calling the RustCrypto crate directly (feature ON) or by wrapping the
## corresponding `embassy-crypto-driver` unitrait (feature OFF).  When a
## feature is ON the type is a direct alias to the RustCrypto type and no
## link-time driver is registered for that operation.  When it is OFF the
## type is a thin wrapper over the unitrait and exactly one crate in the
## dependency tree must register a driver via the `embassy_crypto_*_impl!`
## macros, or linking will fail.
##
## Composite operations keep the layering: for example, enabling
## `driver-aes128cbc` but leaving `driver-aes128` off means CBC mode is the
## RustCrypto `cbc` crate built on top of the unitrait-wrapped `Aes128`, so
## a hardware ECB accelerator still accelerates CBC.

## Enable all-rustcrypto drivers
driver-rustcrypto = [
    "driver-md5",
    "driver-sha1",
    "driver-sha2",
    "driver-hmac-sha1",
    "driver-hmac-sha2",
    "driver-aes128",
    "driver-aes256",
    "driver-aes128cbc",
    "driver-aes256cbc",
    "driver-aes128ctr",
    "driver-aes256ctr",
    "driver-aes128gcm",
    "driver-aes256gcm",
    "driver-aes128ccm",
    "driver-aes256ccm",
    "driver-aes128cmac",
    "driver-aes256cmac",
    "driver-p256-ec",
    "driver-p256-scalar-mul",
    "driver-p256-scalar-invert",
    "driver-p256-lincomb",
    "driver-p384-scalar-mul",
    "driver-p384-scalar-invert",
    "driver-p384-lincomb",
]

## Run the high-level asymmetric P-256 API (`asymmetric` module) in software
## via the `p256` crate, calling RustCrypto directly instead of the `P256Ec`
## unitrait. Enables the p256 ECDSA machinery; without it, the `p256_ec`
## high-level API compiles with no software EC stack, so an asm/HAL backend
## can serve it — smaller code size for that use case.
driver-p256-ec = ["p256-ecdsa", "p256/ecdh"]

## Run the high-level asymmetric P-384 API (`asymmetric::p384`) in software
## via the `p384` crate, calling RustCrypto directly instead of the `P384Ec`
## unitrait. Enables the p384 ECDSA machinery; without it, the `p384_ec`
## high-level API compiles with no software EC stack, so an asm/HAL backend
## can serve it — smaller code size for that use case.
driver-p384-ec = ["p384-ecdsa", "p384/ecdh"]

## Run the high-level asymmetric X25519 API (`asymmetric::x25519`) in software
## via the `x25519-dalek` crate, calling it directly instead of the `X25519`
## unitrait. Without it, the `x25519` high-level API compiles with no
## software X25519 stack, so an asm/HAL backend can serve it — smaller code
## size for that use case.
driver-x25519 = ["dep:x25519-dalek"]

driver-md5 = ["dep:md-5"]
driver-sha1 = ["dep:sha1"]
driver-sha2 = ["dep:sha2"]
driver-hmac-sha1 = ["dep:hmac", "dep:sha1"]
driver-hmac-sha2 = ["dep:hmac", "dep:sha2"]
driver-aes128 = ["dep:aes"]
driver-aes256 = ["dep:aes"]
driver-aes128cbc = ["dep:aes", "dep:cbc"]
driver-aes256cbc = ["dep:aes", "dep:cbc"]
driver-aes128ctr = ["dep:aes", "dep:ctr"]
driver-aes256ctr = ["dep:aes", "dep:ctr"]
driver-aes128gcm = ["dep:aes-gcm"]
driver-aes256gcm = ["dep:aes-gcm"]
driver-aes128ccm = ["dep:ccm", "dep:aes"]
driver-aes256ccm = ["dep:ccm", "dep:aes"]
driver-aes128cmac = ["dep:cmac", "dep:aes"]
driver-aes256cmac = ["dep:cmac", "dep:aes"]
driver-p256-scalar-mul = ["dep:p256"]
driver-p256-scalar-invert = ["dep:p256"]
driver-p256-lincomb = ["dep:p256"]
driver-p384-scalar-mul = ["dep:p384"]
driver-p384-scalar-invert = ["dep:p384"]
driver-p384-lincomb = ["dep:p384"]
